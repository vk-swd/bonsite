networks:
  backend_net:
    driver: bridge
    name: backend_net

volumes:
  vol1:
  config_folder:

# Environment variables are read from .env file automatically
services:
  config_folder_mounter:
    # Copy tsconfig into a named volume "config_folder"
    #   so it is mounted inside the "node_app" base service
    #   to avoid the " - ../tsconfig.json:${CONFIG_FOLDER}"
    image: busybox
    volumes:
      - config_folder:${CONFIG_FOLDER}
      - ./:${SOURCEDIR}
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp ${SOURCEDIR}/tsconfig.json ${CONFIG_FOLDER}/; ls ${CONFIG_FOLDER}/"]
    container_name: config_folder_mounter

  frontend_builder:
      extends: 
        file: base_yamls/node_app.yaml
        service: node_app
      environment:
        - FRONTEND_DEPLOY_FOLDER=${FRONTEND_DEPLOY_FOLDER}
      volumes:
        - ./${FRONTEND_NAME}:${SOURCEDIR}
        - vol1:${FRONTEND_DEPLOY_FOLDER}
      container_name: frontend_builder
      tty: false
      stdin_open: false

  frontend_server:
    image: nginx:mainline-alpine3.22
    container_name: frontend_server
    environment:
      - NGINX_ENVSUBST_TEMPLATE_DIR=${NGINX_TEMPLATE_FOLDER}
      - NGINX_ENVSUBST_TEMPLATE_SUFFIX=.template
      - NGINX_PORT=${NGINX_PORT}
      - NGINX_FOLDER=${NGINX_FOLDER}
    volumes:
    - vol1:/${NGINX_FOLDER}
    - ./${FRONTEND_NAME}/f.conf:${NGINX_TEMPLATE_FOLDER}/f.conf.template
    ports:
    - "127.0.0.1:81:81"
    networks: 
      - backend_net
  gql:
      extends: 
        file: base_yamls/node_app.yaml
        service: node_app
      volumes:
        - ./${GRAPH_QL_APP_NAME}:${SOURCEDIR}
        - ./${COMMON_DIR_NAME}/generator_parameters.ts:/${COMMON_DIR_NAME}/generator_parameters.ts
        - ./${COMMON_DIR_NAME}/monitoring.ts:/${COMMON_DIR_NAME}/monitoring.ts
      container_name: "${GRAPH_QL_APP_NAME}"
      hostname: "${GRAPH_QL_APP_NAME}"
      environment:
        - GENERATOR_PORT=${GENERATOR_PORT}
        - GENERATOR_HOST=${GENERATOR_NAME}

  generator:
      extends: 
        file: base_yamls/node_app.yaml
        service: node_app
      volumes:
        - ./${GENERATOR_NAME}:${SOURCEDIR}
        - ./${COMMON_DIR_NAME}:/${COMMON_DIR_NAME}/
        - ./${COMMON_DIR_NAME}/monitoring.ts:/${COMMON_DIR_NAME}/monitoring.ts
      container_name: "${GENERATOR_NAME}"
      hostname: "${GENERATOR_NAME}"
      environment:
        - GENERATOR_PORT=${GENERATOR_PORT}
        - KAFKA_BROKERS=${KAFKA_BROKERS}
  db_consumer:
      extends: 
        file: base_yamls/node_app.yaml
        service: node_app
      volumes:
        - ./${DB_CONSUMER_NAME}:${SOURCEDIR}
        - ./${COMMON_DIR_NAME}:/${COMMON_DIR_NAME}/
        - ./${COMMON_DIR_NAME}/monitoring.ts:/${COMMON_DIR_NAME}/monitoring.ts
      container_name: "${DB_CONSUMER_NAME}"
      hostname: "${DB_CONSUMER_NAME}"
      environment:
        - KAFKA_BROKERS=${KAFKA_BROKERS}
        - MSSQL_PASSWORD=${MSSQL_PASSWORD}
        - MSSQL_USER=${MSSQL_USER}
        - MSSQL_DB_NAME=${MSSQL_DB_NAME}
        - MSSQL_HOSTNAME=${MSSQL_HOSTNAME}


  graphana:
    image: grafana/grafana:11.6.3
    container_name: "${GRAPHANA_NAME}"
    hostname: "${GRAPHANA_NAME}"
    volumes:
      -  /${GRAPHANA_DASHBOARD_FOLDER}
      - ./${GRAPHANA_NAME}/datasources.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./${GRAPHANA_NAME}/grafana.ini:/etc/grafana/grafana.ini
      - ./${GRAPHANA_NAME}/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./${GRAPHANA_NAME}/dash1.json:/${GRAPHANA_DASHBOARD_FOLDER}/dash1.json
    environment:
      - PROMETHEUS_HOST=${PROMETHEUS_NAME}
      - PROMETHEUS_PORT=9090
      - GRAPHANA_DASHBOARD_FOLDER=${GRAPHANA_DASHBOARD_FOLDER}
    ports:
      - "127.0.0.1:${GRAPHANA_PORT_HOST}:3000"
    networks: 
      - backend_net

  # monitoring-analytics:
  #   extends:
  #     file: base_yamls/node_app.yaml
  #     service: node_app
  #   container_name: ${MONITORING_ANALYTICS}
  #   hostname: ${MONITORING_ANALYTICS}
  #   environment:
  #       - M_PORT=${PROM_PORT}
  

  prometheus:
    image: prom/prometheus
    # ports:
    #   - "127.0.0.1:9090:9090"
    volumes:
      - ./${PROMETHEUS_NAME}:${SOURCEDIR}
    container_name: "${PROMETHEUS_NAME}"
    hostname: "${PROMETHEUS_NAME}"
    entrypoint: ["sh", "-c"]
    tty: true
    command: ['sed "s/__TARGET_PLACEHOLDER__/${PROMETHEUS_TARGETS}/" 
              ${SOURCEDIR}/prometheus.template.yml > /etc/prometheus/prometheus.yml;
              prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus;
              exec sh']
    networks: 
      - backend_net


  kafka1:
    extends: 
      file: base_yamls/node_app.yaml
      service: kafka-app
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://${KAFKA_HOST}:9092'
    container_name: "${KAFKA_HOST}"
    hostname: "${KAFKA_HOST}"

  # kafka2:
  #   extends: 
  #     file: base_yamls/node_app.yaml
  #     service: kafka-app
  #   environment:
  #     KAFKA_NODE_ID: 2
  #     KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://${KAFKA_HOST}2:9092'
  #   container_name: "${KAFKA_HOST}2"
  #   hostname: "${KAFKA_HOST}2"


  sqldb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    volumes:
      - "${WORKDIR}"
    working_dir: ${WORKDIR}
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    ports:
      - name: mdb
        target: 1433
        published: 1433
        host_ip: "127.0.0.1"
    
    #   - "1433:1433"
    hostname: "${MSSQL_HOSTNAME}"
    container_name: "${MSSQL_HOSTNAME}"
    networks: 
        - backend_net

  sqlcmd:
    image: mcr.microsoft.com/mssql-tools
    container_name: "sqlcmd"
    depends_on:
      - sqldb
    volumes:
      - ${WORKDIR}
      - ./${MSSQL_CMD_NAME}:${SOURCEDIR}
    working_dir: ${WORKDIR}
    entrypoint: ["/bin/bash", "-c"]
    command: ["${SOURCEDIR}/init.sh"]
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_CONSUMER_PASSWORD=${MSSQL_CONSUMER_PASSWORD}
      - MSSQL_CONSUMER_USERNAME=${MSSQL_CONSUMER_USERNAME}
    networks: 
        - backend_net

