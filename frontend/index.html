<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bank Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
    }
    .section {
      margin-bottom: 3rem;
    }
    table, th, td {
      border: 1px solid #aaa;
      border-collapse: collapse;
      padding: 0.5rem;
    }
    input[type="date"] {
      margin-right: 1rem;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
    }
  </style>
</head>
<body>
  <div class="section">
    <h2>Prometheus Metrics</h2>
    <canvas id="metricsChart" width="800" height="300"></canvas>
  </div>

  <div class="section">
    <h2>Bank Statement</h2>

    <label>From: <input type="date" id="startDate" /></label>
    <label>To: <input type="date" id="endDate" /></label>
    <button id="b_bank_statement">Load Statement</button>

    <table id="statementTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Amount</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <button id="b_download">Download as TXT</button>

    <title>Inline Inputs</title>
    <div class="input-row" style="width: 800px; display: flex; flex-wrap: wrap; gap: 10px;">
      <div style="width: 400px; display: flex; flex-direction: column;">
        <label for="input1">ID</label>
        <input id="input1" type="text">
      </div>
    
      <!-- Uncomment these if you need them -->
      <!--
      <div style="display: flex; flex-direction: column;">
        <label for="input2">Name</label>
        <input id="input2" type="text">
      </div>
      -->
    
      <div style="display: flex; flex-direction: column; justify-content: flex-end;">
        <button id="input_button">Add Face!</button>
      </div>
    
      <div style="display: flex; flex-direction: column; justify-content: flex-end;">
        <button id="get_face">Get Face!</button>
      </div>
    </div>
    

  </div>

  <script src="main.js"></script>
</body>
</html>
