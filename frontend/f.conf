log_format  mylogformat  '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" "$http_cf_connecting_ip"';
server {
    error_log ${LOG_MOUNT}/nginx_extra_error.log;
    access_log ${LOG_MOUNT}/nginx_extra_access.log mylogformat;

    listen ${NGINX_PORT};
    resolver 127.0.0.11;
    location /graphql {
        auth_request /auth;
        proxy_pass http://${GRAPH_QL_HOSTNAME}:${GRAPH_QL_PORT};
    }
    location ~ /login.(html|js) {
        root ${NGINX_FOLDER};
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com ; frame-src 'self' https://challenges.cloudflare.com ; style-src 'self' 'unsafe-inline'" always;
    }
    location ~ /((index|doc).html|main.js|umls/[^\.]*.svg) {
        auth_request /auth;
        error_page 401 = /login.html;
        error_page 403 = /login.html;
        root ${NGINX_FOLDER};
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com ; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'" always;
    }
    location = / {
        root ${NGINX_FOLDER};
        index doc.html;
    }
    location = /favicon.ico {
        return 300;
    }
    location /login {
        proxy_pass http://${AUTH_APP_NAME}:${AUTH_PORT};
    }
    location /auth {
        proxy_pass http://${AUTH_APP_NAME}:${AUTH_PORT};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }
    location / {
        return 444;
    }
}