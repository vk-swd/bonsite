

networks:
  backend_net:
    driver: bridge
    name: backend_net
  edge_net:
    driver: bridge
    name: edge_net

volumes:
  build_folder:
  shared_dir:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1G

services:
  frontend_builder:
      extends:
        file: frontend_builder/compose.yaml
        service: frontend_builder
  nginx_server:
    extends:
      file: ./nginx_server/compose.yaml
      service: nginx_server
    depends_on:
      gql:
        condition: service_healthy
      frontend_builder:
        condition: service_completed_successfully
    networks:
      - backend_net
      - edge_net
  auth:
    extends:
      file: ./auth/compose.yaml
      service: auth
    depends_on:
      redis:
        condition: service_started
    networks:
      - edge_net
      - backend_net
  
  redis:
    extends:
      file: ./auth/compose.yaml
      service: redis
    networks:
      - backend_net

  gql:
    extends:
      file: ./${GQL_APP_NAME}/compose.yaml
      service: ${GQL_APP_NAME}
    networks:
      - backend_net

  generator:
    extends:
      file: ./generator/compose.yaml
      service: generator
    networks:
      - backend_net
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka:
    extends:
      file: ./kafka/compose.yaml
      service: kafka
    networks:
      - backend_net

  kafka-init:
    extends:
      file: ./kafka/compose.yaml
      service: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend_net

  message_sink:
    extends:
      file: ./${MESSAGE_SINK_NAME}/compose.yaml
      service: ${MESSAGE_SINK_NAME}
    networks:
      - backend_net
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db_initializer:
        condition: service_completed_successfully

  sqldb:
    extends:
      file: ./sqldb/compose.yaml
      service: sqldb
    ports:
      - "1433:1433"
    networks:
      - backend_net
  
  sql_monitor:
    extends:
      file: ./sqldb/compose.yaml
      service: sql_monitor
    networks:
      - backend_net
    depends_on:
      sqldb:
        condition: service_started

  db_initializer:
    extends:
      file: ./${DB_INITIALIZER_NAME}/compose.yaml
      service: ${DB_INITIALIZER_NAME}
    networks:
      - backend_net
    depends_on:
      sql_monitor:
        condition: service_healthy

  statement_generator:
    extends:
      file: ./statement_generator/compose.yaml
      service: statement_generator
    networks:
      - backend_net
    depends_on:
      db_initializer:
        condition: service_completed_successfully

  prometheus:
    extends:
      file: ./prometheus/compose.yaml
      service: prometheus
    networks:
      - backend_net
  
  grafana:
    extends:
      file: ./graphana/compose.yaml
      service: graphana
    networks:
      - backend_net
      - edge_net
  
  
  deploy_single_host:
    image: busybox
    depends_on:
      nginx_server:
        condition: service_started
      auth:
        condition: service_healthy
      redis:
        condition: service_started
      db_initializer:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      gql:
        condition: service_healthy
      prometheus:
        condition: service_started
      grafana:
        condition: service_started
      generator:
        condition: service_healthy
      statement_generator:
        condition: service_healthy
      message_sink:
        condition: service_healthy