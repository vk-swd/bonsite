log_format  mylogformat  '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" "$http_cf_connecting_ip"';
server {
    error_log ${LOG_MOUNT}/nginx_extra_error.log;
    access_log ${LOG_MOUNT}/nginx_extra_access.log mylogformat;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    listen ${NGINX_PORT};
    resolver 127.0.0.11;
    location = /graphql {
        proxy_pass http://${NGINX_GQL_HOSTNAME}:${NGINX_GQL_PORT};
    }
    location ~ /((index|doc).html|main.js|umls/[^\.]*.svg)$ {
        root ${NGINX_FOLDER};
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aVvKqDvjbgC6m2lTwIXUjTc9D1sRmRSRQOOYQQMR6gM=' https://challenges.cloudflare.com ; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'" always;
    }
    location / {
        root ${NGINX_FOLDER};
        try_files $uri /doc.html;
    }
    location ~ "/index.html=[0-9]{13}" {
        root ${NGINX_FOLDER};
        try_files $uri /index.html;
    }
    location ~ "/doc.html=[0-9]{13}" {
        root ${NGINX_FOLDER};
        try_files $uri /doc.html;
    }
    location = /favicon.ico {
        return 300;
    }
}