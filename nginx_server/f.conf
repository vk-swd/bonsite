log_format  mylogformat  '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" "$http_cf_connecting_ip"';
server {
    error_log ${LOG_MOUNT}/nginx_extra_error.log;
    access_log ${LOG_MOUNT}/nginx_extra_access.log mylogformat;

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    listen ${NGINX_PORT};
    resolver 127.0.0.11;
    location = /graphql {
        auth_request /auth;
        proxy_pass http://${NGINX_GQL_HOSTNAME}:${NGINX_GQL_PORT};
    }
    location ~ /login.(js|html|js\.map)$ {
        root ${NGINX_FOLDER};
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://accounts.google.com; script-src 'self' https://accounts.google.com https://apis.google.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com ; style-src 'self' 'unsafe-inline'" always;
    }
    location ~ /((index|doc).html|main.js|umls/[^\.]*.svg)$ {
        auth_request /auth;
        error_page 401 = /session;
        error_page 403 = /session;
        root ${NGINX_FOLDER};
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-aVvKqDvjbgC6m2lTwIXUjTc9D1sRmRSRQOOYQQMR6gM=' https://challenges.cloudflare.com ; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'" always;
    }
    location / {
        root ${NGINX_FOLDER};
        try_files $uri /doc.html;
    }
    location ~ "/index.html=[0-9]{13}" {
        root ${NGINX_FOLDER};
        try_files $uri /index.html;
    }
    location ~ "/doc.html=[0-9]{13}" {
        root ${NGINX_FOLDER};
        try_files $uri /doc.html;
    }
    
    location ~ "/login.html=[0-9]{13}" {
        root ${NGINX_FOLDER};
        try_files $uri /login.html;
    }
    location = /favicon.ico {
        return 300;
    }
    location = /login {
        proxy_pass http://${NGINX_AUTH_HOSTNAME}:${NGINX_AUTH_PORT};
    }
    location ~ /(auth|googleAuth|session) {
        proxy_pass http://${NGINX_AUTH_HOSTNAME}:${NGINX_AUTH_PORT};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}